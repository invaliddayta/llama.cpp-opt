      <rect x="389.5" y="225.5" width="300" height="30" fill="#16191e" stroke="#45484e"/>
      <text x="404" y="245" fill="#76b900">FA</text><text x="436" y="245" fill="#c9cbd0">fused q4_0 KV loader</text>
