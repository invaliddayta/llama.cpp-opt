  <desc id="desc">llama.cpp-opt: a llama.cpp fork tuned for speculative decoding on the RTX 3090. Small-batch int8 tensor-core GEMM, fused q4 KV attention, GPU tool grammar, GPU-resident DFlash features, sleep cache.</desc>
